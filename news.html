<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أخبار ومسابقات دار الفرقان</title>
<meta name="description" content="آخر أخبار دار الفرقان وإعلانات المسابقات والفعاليات.">
<meta name="theme-color" content="#3A181E">
<link rel="icon" type="image/png" sizes="96x96" href="icon-96.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap"></noscript>
<style>
:root{color-scheme:light}
body.dark-mode{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.9;transition:background .25s ease,color .25s ease}
.fa-solid,.fa-brands{margin-inline-end:6px}
header{background:var(--header-bg);color:var(--header-text);padding:18px 20px;padding-top:calc(18px + env(safe-area-inset-top,0));border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold)}
header h1{font-family:"Amiri","Traditional Arabic",Georgia,serif;font-size:1.7rem;margin:0;color:var(--gold);line-height:1.3}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:20px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:700;text-decoration:none}
main{max-width:820px;margin:0 auto;padding:28px 16px calc(60px + env(safe-area-inset-bottom,0))}
.doc{background:var(--glass-bg);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:22px 20px;box-shadow:var(--glass-shadow)}
h2{font-family:"Amiri","Traditional Arabic",Georgia,serif;color:var(--wine);font-size:1.5rem;margin:26px 0 6px}
h2:first-of-type{margin-top:0}
p,li{margin:6px 0}
ul{padding-inline-start:22px}
.note{background:rgba(250,200,27,.14);border-right:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin:14px 0}
a{color:var(--wine);font-weight:700}
small{color:var(--text-muted)}
@media(max-width:600px){header h1{font-size:1.4rem}}
</style>
<link rel="stylesheet" href="theme.css">

<meta property="og:title" content="أخبار ومسابقات دار الفرقان">
<meta property="og:image" content="https://dar-alforqan.github.io/dar/og-image.jpg">
<link rel="canonical" href="https://dar-alforqan.github.io/dar/news.html">
</head>
<body>
<script>(function(){try{var o=localStorage.getItem("dar-theme-override");var d=o?o==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.body.classList.toggle("dark-mode",d);var f=parseInt(localStorage.getItem("dar-font-scale"),10);if(f>=85&&f<=150)document.documentElement.style.fontSize=f+"%"}catch(e){}})()</script>
<script src="theme.js" defer></script>
<script src="site-config.js" defer></script>
<script src="news-feed.js" defer></script>
<header>
  <div class="brand"><img src="icon-96.png" alt="شعار دار الفرقان" width="48" height="48"><h1>الأخبار والمسابقات</h1></div>
  <div class="header-actions">
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i>الرئيسية</a>
    <a href="account.html" class="nav-btn"><i class="fa-solid fa-user"></i>حسابي</a>
    <button id="themeToggle" class="nav-btn" type="button" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i>ليلي</button>
  </div>
</header>
<main>
  <div class="feed-wrap">
    <div id="newsList" class="feed" data-feed data-limit="30"><div class="empty-state"><p>جاري تحميل المنشورات...</p></div></div>
  </div>
</main>
</body>
</html>
