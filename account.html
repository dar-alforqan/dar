<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابي | دار الفرقان</title>
<style>
:root{
  --wine:#3A181E;
  --cream:#F6E7DD;
  --gold:#FAC81B;
  --ink:#2a1015;
  --card-bg:#ffffff;
  --input-bg:#fffdfb;
  --line:#d9c3b5;
  --err:#a4161a;
  --header-bg:var(--wine);
  --header-text:var(--cream);
  --text-muted:#6b5249;
}

body.dark-mode{
  --wine:#FAC81B;
  --cream:#121212;
  --ink:#f3f3f3;
  --card-bg:#1e1e1e;
  --input-bg:#2a2a2a;
  --line:#333333;
  --header-bg:#0a0a0a;
  --header-text:#ffffff;
  --text-muted:#a0a0a0;
}

*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;transition:background .25s ease,color .25s ease}
header{background:var(--header-bg);color:var(--header-text);padding:24px 20px;border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center;transition:background .25s ease}
header h1{font-family:"Traditional Arabic","Amiri",Georgia,serif;font-size:2rem;margin:0}
header p{margin:4px 0 0;opacity:.85}
.theme-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:20px;cursor:pointer;font:inherit;font-size:.9rem;font-weight:bold}
main{max-width:520px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:10px;padding:22px;transition:background .25s ease,border-color .25s ease}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:1px solid var(--wine);background:transparent;color:var(--wine);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--wine);color:var(--cream)}
body.dark-mode .tabs button[aria-selected=true]{color:#141414}
label{display:block;font-weight:500;margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--input-bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.primary{width:100%;margin-top:18px;padding:12px;background:var(--gold);color:#3A181E;border:0;border-radius:8px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.primary:disabled{opacity:.6}
.link{background:none;border:0;color:var(--wine);text-decoration:underline;font:inherit;cursor:pointer;padding:0;margin-top:12px}
.msg{margin-top:14px;padding:10px;border-radius:8px;display:none}
.msg.err{display:block;background:#fbe3e3;color:var(--err)}
.msg.ok{display:block;background:#e5f3e2;color:#1d5a14}
body.dark-mode .msg.err{background:#3b1012;color:#ff9b9e}
body.dark-mode .msg.ok{background:#0e2e13;color:#85e085}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.top strong{font-family:"Traditional Arabic","Amiri",Georgia,serif;font-size:1.4rem}
h2{font-family:"Traditional Arabic","Amiri",Georgia,serif;margin:28px 0 10px;font-size:1.4rem}
.item{border-right:4px solid var(--gold);background:var(--card-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:10px 14px;margin-bottom:10px;border-radius:6px;transition:background .25s ease,border-color .25s ease}
.item small{color:var(--text-muted)}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <div>
    <h1>دار الفرقان</h1>
    <p>تحفيظ القرآن · الإجازات · التجويد · القراءات</p>
  </div>
  <button id="themeToggle" class="theme-btn" type="button" aria-label="تبديل الوضع">🌙 ليلي</button>
</header>
<main>

<section id="authView" class="card hidden">
  <div class="tabs" role="tablist">
    <button id="tabLogin" role="tab" aria-selected="true">تسجيل الدخول</button>
    <button id="tabSignup" role="tab" aria-selected="false">إنشاء حساب</button>
  </div>
  <form id="authForm" novalidate>
    <div id="nameRow" class="hidden"><label for="name">الاسم</label><input id="name" autocomplete="name"></div>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email" dir="ltr" required>
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" dir="ltr" minlength="6" required>
    <button class="primary" id="authBtn" type="submit">دخول</button>
    <button class="link" id="resetBtn" type="button">نسيت كلمة المرور؟</button>
    <div id="authMsg" class="msg" role="alert"></div>
  </form>
</section>

<section id="appView" class="hidden">
  <div class="top"><strong id="hello"></strong><button class="link" id="logout">تسجيل الخروج</button></div>
  <div class="card">
    <form id="regForm" novalidate>
      <label for="fullName">الاسم الكامل</label><input id="fullName" required>
      <label for="phone">رقم الواتساب</label><input id="phone" type="tel" dir="ltr" required>
      <label for="program">البرنامج المطلوب</label>
      <select id="program"><option>تحفيظ القرآن</option><option>إجازة</option><option>التجويد</option><option>القراءات</option></select>
      <label for="notes">ملاحظات (المستوى الحالي، المواعيد المناسبة)</label><textarea id="notes" rows="4" maxlength="1000"></textarea>
      <button class="primary" id="regBtn" type="submit">إرسال الطلب</button>
      <div id="regMsg" class="msg" role="alert"></div>
    </form>
  </div>
  <h2>طلباتي</h2>
  <div id="list"><p>لسه مفيش طلبات.</p></div>
</section>

</main>
<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// إدارة الوضع الليلي
const themeToggle = document.getElementById("themeToggle");
const currentTheme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

function applyTheme(theme) {
  if (theme === "dark") {
    document.body.classList.add("dark-mode");
    themeToggle.textContent = "☀️ نهاري";
  } else {
    document.body.classList.remove("dark-mode");
    themeToggle.textContent = "🌙 ليلي";
  }
}
applyTheme(currentTheme);

themeToggle.onclick = () => {
  const isDark = document.body.classList.contains("dark-mode");
  const nextTheme = isDark ? "light" : "dark";
  localStorage.setItem("theme", nextTheme);
  applyTheme(nextTheme);
};

// تهيئة Firebase والواجهة
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
let mode = "login", unsub = null;

const errors = {
  "auth/invalid-email":"البريد الإلكتروني غير صحيح.",
  "auth/email-already-in-use":"البريد ده مسجل قبل كده. جرّب تسجيل الدخول.",
  "auth/weak-password":"كلمة المرور لازم تكون 6 حروف أو أكتر.",
  "auth/invalid-credential":"البريد أو كلمة المرور غلط.",
  "auth/user-not-found":"مفيش حساب بالبريد ده.",
  "auth/wrong-password":"كلمة المرور غلط.",
  "auth/too-many-requests":"محاولات كتير. استنى شوية وجرّب تاني.",
  "auth/network-request-failed":"مشكلة في الإنترنت. جرّب تاني."
};
const show = (el, type, text) => { el.className = "msg " + type; el.textContent = text; };
const clear = el => { el.className = "msg"; el.textContent = ""; };

function setMode(m){
  mode = m; const s = m === "signup";
  $("tabLogin").setAttribute("aria-selected", !s);
  $("tabSignup").setAttribute("aria-selected", s);
  $("nameRow").classList.toggle("hidden", !s);
  $("authBtn").textContent = s ? "إنشاء الحساب" : "دخول";
  $("password").autocomplete = s ? "new-password" : "current-password";
  $("resetBtn").classList.toggle("hidden", s);
  clear($("authMsg"));
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

$("authForm").onsubmit = async e => {
  e.preventDefault(); clear($("authMsg"));
  const email = $("email").value.trim(), pass = $("password").value;
  if (!email || pass.length < 6) return show($("authMsg"), "err", "اكتب البريد وكلمة مرور من 6 حروف على الأقل.");
  $("authBtn").disabled = true;
  try {
    if (mode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const n = $("name").value.trim();
      if (n) await updateProfile(cred.user, { displayName: n });
    } else await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) { show($("authMsg"), "err", errors[err.code] || "حصل خطأ. جرّب تاني."); }
  $("authBtn").disabled = false;
};

$("resetBtn").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return show($("authMsg"), "err", "اكتب بريدك الأول وبعدين اضغط نسيت كلمة المرور.");
  try { await sendPasswordResetEmail(auth, email); show($("authMsg"), "ok", "بعتنالك رابط تغيير كلمة المرور على البريد."); }
  catch (err) { show($("authMsg"), "err", errors[err.code] || "حصل خطأ. جرّب تاني."); }
};

$("logout").onclick = () => signOut(auth);

$("regForm").onsubmit = async e => {
  e.preventDefault(); clear($("regMsg"));
  const fullName = $("fullName").value.trim(), phone = $("phone").value.trim();
  const program = $("program").value, notes = $("notes").value.trim();

  if (fullName.length < 2 || phone.length < 8) return show($("regMsg"), "err", "اكتب الاسم الكامل ورقم واتساب صحيح.");
  $("regBtn").disabled = true;

  try {
    await addDoc(collection(db, "registrations"), {
      uid: auth.currentUser.uid,
      fullName,
      phone,
      program,
      notes,
      createdAt: serverTimestamp()
    });

    show($("regMsg"), "ok", "تم إرسال الطلب وجاري فتح واتساب...");

    const adminWhatsAppNumber = "201099262489";
    const waText = `السلام عليكم ورحمة الله وبركاته\n`
                 + `*طلب تسجيل جديد - دار الفرقان*\n\n`
                 + `• *الاسم الكامل:* ${fullName}\n`
                 + `• *رقم الهاتف:* ${phone}\n`
                 + `• *البرنامج المطلوب:* ${program}\n`
                 + `• *ملاحظات:* ${notes || 'لا توجد'}`;

    const waUrl = `https://wa.me/${adminWhatsAppNumber}?text=${encodeURIComponent(waText)}`;
    window.open(waUrl, "_blank");

    $("regForm").reset();
    $("fullName").value = auth.currentUser.displayName || "";
  } catch (err) {
    show($("regMsg"), "err", "ماقدرناش نرسل الطلب. جرّب تاني.");
  }
  $("regBtn").disabled = false;
};

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  $("authView").classList.toggle("hidden", !!user);
  $("appView").classList.toggle("hidden", !user);
  if (!user) return;
  $("hello").textContent = "أهلاً " + (user.displayName || user.email);
  $("fullName").value = user.displayName || "";
  unsub = onSnapshot(query(collection(db, "registrations"), where("uid", "==", user.uid)), snap => {
    const rows = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    const list = $("list"); list.replaceChildren();
    if (!rows.length) { list.innerHTML = "<p>لسه مفيش طلبات.</p>"; return; }
    rows.forEach(r => {
      const div = document.createElement("div"); div.className = "item";
      const b = document.createElement("strong"); b.textContent = r.program;
      const s = document.createElement("small");
      s.textContent = " · " + (r.createdAt ? r.createdAt.toDate().toLocaleDateString("ar-EG") : "جاري الإرسال");
      const p = document.createElement("p"); p.style.margin = "4px 0 0"; p.textContent = r.notes || "";
      div.append(b, s, p); list.append(div);
    });
  });
});
setMode("login");
</script>
</body>
</html>
